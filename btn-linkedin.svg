<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 48" width="132" height="48" role="img" aria-label="LINKEDIN" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.t{fill:#d5e6df}.m{fill:#7fa89c}.tl{fill:#5eead4;font-weight:700;letter-spacing:2px}.am{fill:#ffb454;font-weight:700}
.fade{animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fade,.flow,.pulse,.spin{animation:none}}
</style><rect x="1" y="1" width="130" height="46" rx="10" fill="#0c1210" stroke="#5eead4" stroke-width="1.5"/><text class="tl" x="24" y="29" font-size="13" letter-spacing="2">LINKEDIN</text><text class="am" x="102" y="29" font-size="15">→</text>
</svg>