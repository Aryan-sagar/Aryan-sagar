<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 568" width="920" height="568" role="img" aria-label="Boot sequence: Aryan Sagar, systems, ML, data. Build software that stays correct when reality stops cooperating." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.t{fill:#d5e6df}.m{fill:#7fa89c}.tl{fill:#5eead4}.am{fill:#ffb454}
.ln{animation:ln .5s ease-out both}
@keyframes ln{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2s cubic-bezier(.3,.7,.2,1) .5s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ln,.grow,.blink,.pulse{animation:none}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#ffb454"/></linearGradient></defs>
<rect width="920" height="568" rx="12" fill="#070a09"/>
<rect x="10" y="10" width="900" height="548" rx="10" fill="#0c1210" stroke="#1d2b26"/>
<path d="M10 46H910V20a10 10 0 0 0-10-10H20a10 10 0 0 0-10 10Z" fill="#101a16"/><line x1="10" x2="910" y1="46" y2="46" stroke="#1d2b26"/>
<circle cx="32" cy="28" r="5.5" fill="#ff6b6b" opacity=".85"/><circle cx="52" cy="28" r="5.5" fill="#ffb454" opacity=".85"/><circle cx="72" cy="28" r="5.5" fill="#5eead4" opacity=".85"/>
<text class="m" x="460" y="33" text-anchor="middle" font-size="12" letter-spacing="1">aryan@lab: ~/boot_sequence</text>
<g class="ln" style="animation-delay:0.2s"><text class="am" x="32" y="80" font-size="13">$</text><text class="t" x="50" y="80" font-size="13" letter-spacing="1">INITIALIZING ARYAN.SAGAR...</text></g>
<g class="ln" style="animation-delay:0.4s"><rect x="32" y="98" width="420" height="14" rx="7" fill="#16211d" stroke="#1d2b26"/></g>
<rect class="grow" x="32" y="98" width="420" height="14" rx="7" fill="url(#g)"/><g class="ln" style="animation-delay:2.4s"><text class="am" x="470" y="110" font-size="13">100%</text></g>
<g class="ln" style="animation-delay:0.8s"><text class="m" x="32" y="152" font-size="13">IDENTITY</text><text class="am" x="186" y="152" font-size="13">→</text><text class="t" x="214" y="152" font-size="13">SYSTEMS / ML / DATA</text></g>
<g class="ln" style="animation-delay:0.98s"><text class="m" x="32" y="176" font-size="13">ENVIRONMENT</text><text class="am" x="186" y="176" font-size="13">→</text><text class="t" x="214" y="176" font-size="13">DISTRIBUTED SYSTEMS / STREAMING</text></g>
<g class="ln" style="animation-delay:1.16s"><text class="m" x="32" y="200" font-size="13">PRIMARY WEAPON</text><text class="am" x="186" y="200" font-size="13">→</text><text class="t" x="214" y="200" font-size="13">PYTHON / C++ / SQL / FLINK</text></g>
<g class="ln" style="animation-delay:1.34s"><text class="m" x="32" y="224" font-size="13">CURRENT MODE</text><text class="am" x="186" y="224" font-size="13">→</text><text class="t" x="214" y="224" font-size="13">BUILD</text></g>
<g class="ln" style="animation-delay:1.52s"><text class="m" x="32" y="248" font-size="13">STATUS</text><text class="am" x="186" y="248" font-size="13">→</text><circle class="pulse" cx="222" cy="244" r="4.5" fill="#5eead4"/><text class="tl" x="236" y="248" font-size="13" font-weight="700" letter-spacing="1">ONLINE</text></g>
<g class="ln" style="animation-delay:1.9s"><text class="m" x="32" y="290" font-size="12" letter-spacing="3">MISSION</text><line x1="112" x2="888" y1="286" y2="286" stroke="#1d2b26"/></g>
<g class="ln" style="animation-delay:2.1s"><text class="tl" x="32" y="318" font-size="17" font-weight="700">Build software that stays correct</text><text class="t" x="32" y="342" font-size="17" font-weight="700">when reality stops cooperating.</text></g>
<g class="ln" style="animation-delay:2.5s"><text class="m" x="32" y="382" font-size="13">[</text><text class="tl" x="42" y="382" font-size="13" font-weight="700">OK</text><text class="m" x="59" y="382" font-size="13">]</text><text class="t" x="86" y="382" font-size="13">retries &amp; race conditions</text></g>
<g class="ln" style="animation-delay:2.65s"><text class="m" x="32" y="406" font-size="13">[</text><text class="tl" x="42" y="406" font-size="13" font-weight="700">OK</text><text class="m" x="59" y="406" font-size="13">]</text><text class="t" x="86" y="406" font-size="13">duplicate requests &amp; bad data</text></g>
<g class="ln" style="animation-delay:2.8s"><text class="m" x="32" y="430" font-size="13">[</text><text class="tl" x="42" y="430" font-size="13" font-weight="700">OK</text><text class="m" x="59" y="430" font-size="13">]</text><text class="t" x="86" y="430" font-size="13">network failures &amp; concurrent writes</text></g>
<g class="ln" style="animation-delay:2.95s"><text class="m" x="32" y="454" font-size="13">[</text><text class="tl" x="42" y="454" font-size="13" font-weight="700">OK</text><text class="m" x="59" y="454" font-size="13">]</text><text class="t" x="86" y="454" font-size="13">distribution shift &amp; partial outages</text></g>
<g class="ln" style="animation-delay:3.1s"><text class="m" x="32" y="478" font-size="13">[</text><text class="tl" x="42" y="478" font-size="13" font-weight="700">OK</text><text class="m" x="59" y="478" font-size="13">]</text><text class="t" x="86" y="478" font-size="13">exactly-once semantics &amp; backpressure</text></g>
<g class="ln" style="animation-delay:3.25s"><text class="m" x="32" y="502" font-size="13">[</text><text class="tl" x="42" y="502" font-size="13" font-weight="700">OK</text><text class="m" x="59" y="502" font-size="13">]</text><text class="t" x="86" y="502" font-size="13">out-of-order events &amp; late data</text></g>
<g class="ln" style="animation-delay:3.6s"><line x1="32" x2="888" y1="516" y2="516" stroke="#1d2b26"/><text class="tl" x="32" y="542" font-size="14" font-weight="700" letter-spacing="2">SYSTEM READY.</text><rect class="blink" x="182" y="530" width="9" height="16" fill="#ffb454"/></g>
</svg>