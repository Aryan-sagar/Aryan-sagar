<text class="m" x="460" y="92" text-anchor="middle" font-size="10" letter-spacing="3">REPEAT</text>
<g class="fade" style="animation-delay:.9s"><text class="am" x="460" y="150" text-anchor="middle" font-size="22" letter-spacing="3">MAKE IT SURVIVE REALITY.</text></g>
