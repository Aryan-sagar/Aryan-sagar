<g class="fade" style="animation-delay:0.3s"><rect x="391" y="30" width="84" height="38" rx="7" fill="#16211d" stroke="#24382f"/><text class="t" x="433.0" y="53.0" text-anchor="middle" font-size="13" letter-spacing=".5">MEASURE</text></g>
<line class="flow" x1="479" x2="505" y1="49" y2="49" stroke="#5eead4" stroke-width="1.6"/><polygon points="503,45 510,49 503,53" fill="#5eead4"/>
<g class="fade" style="animation-delay:0.45s"><rect x="513" y="30" width="108" height="38" rx="7" fill="#16211d" stroke="#24382f"/><text class="t" x="567.0" y="53.0" text-anchor="middle" font-size="13" letter-spacing=".5">UNDERSTAND</text></g>
<line class="flow" x1="625" x2="651" y1="49" y2="49" stroke="#5eead4" stroke-width="1.6"/><polygon points="649,45 656,49 649,53" fill="#5eead4"/>
<g class="fade" style="animation-delay:0.6s"><rect x="659" y="30" width="84" height="38" rx="7" fill="#16211d" stroke="#ffb454"/><text class="am" x="701.0" y="53.0" text-anchor="middle" font-size="13" letter-spacing=".5">REBUILD</text></g>
