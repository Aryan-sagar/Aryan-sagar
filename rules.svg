<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 396" width="920" height="396" role="img" aria-label="The rules: correctness, reliability, performance, observability" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.t{fill:#d5e6df}.m{fill:#7fa89c}.tl{fill:#5eead4;font-weight:700;letter-spacing:2px}.am{fill:#ffb454;font-weight:700}
.fade{animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fade,.flow,.pulse,.spin{animation:none}}
</style><rect width="920" height="396" rx="12" fill="#070a09"/>
<rect x="20" y="20" width="320" height="356" rx="10" fill="#0c1210" stroke="#1d2b26"/>
<circle class="spin" cx="180" cy="198" r="42" fill="none" stroke="#ffb454" stroke-width="1" stroke-dasharray="3 6" opacity=".7"/>
<line class="flow" x1="180" x2="180" y1="76" y2="168" stroke="#5eead4" stroke-width="1.6"/><line class="flow" x1="180" x2="180" y1="228" y2="320" stroke="#5eead4" stroke-width="1.6"/><line class="flow" x1="130" x2="138" y1="198" y2="198" stroke="#5eead4" stroke-width="1.6"/><line class="flow" x1="222" x2="230" y1="198" y2="198" stroke="#5eead4" stroke-width="1.6"/>
<circle cx="180" cy="198" r="30" fill="#16211d" stroke="#ffb454" stroke-width="1.5"/><text class="am" x="180" y="202" text-anchor="middle" font-size="11" letter-spacing="1">RULES</text>
<g class="fade" style="animation-delay:0.1s"><rect x="125" y="48" width="110" height="28" rx="7" fill="#16211d" stroke="#ffb454"/><text class="am" x="180.0" y="66.0" text-anchor="middle" font-size="11" letter-spacing=".5">CORRECTNESS</text></g>
<g class="fade" style="animation-delay:0.5s"><rect x="120" y="320" width="120" height="28" rx="7" fill="#16211d" stroke="#24382f"/><text class="t" x="180.0" y="338.0" text-anchor="middle" font-size="11" letter-spacing=".5">OBSERVABILITY</text></g>
<g class="fade" style="animation-delay:0.3s"><rect x="30" y="184" width="100" height="28" rx="7" fill="#16211d" stroke="#24382f"/><text class="t" x="80.0" y="202.0" text-anchor="middle" font-size="11" letter-spacing=".5">RELIABILITY</text></g>
<g class="fade" style="animation-delay:0.4s"><rect x="230" y="184" width="100" height="28" rx="7" fill="#16211d" stroke="#24382f"/><text class="t" x="280.0" y="202.0" text-anchor="middle" font-size="11" letter-spacing=".5">PERFORMANCE</text></g>
<g class="fade" style="animation-delay:0.2s"><rect x="360" y="20" width="540" height="68" rx="10" fill="#0c1210" stroke="#1d2b26"/><circle cx="394" cy="54.0" r="18" fill="#16211d" stroke="#ffb454" stroke-width="1.3"/><text class="am" x="394" y="58.0" text-anchor="middle" font-size="12">01</text><text class="am" x="430" y="48" font-size="13" letter-spacing=".5">Correctness before cleverness</text>
<text class="t" x="430" y="70" font-size="11">A system that produces the wrong answer faster is still wrong.</text>
</g>
<g class="fade" style="animation-delay:0.35s"><rect x="360" y="100" width="540" height="84" rx="10" fill="#0c1210" stroke="#1d2b26"/><circle cx="394" cy="142.0" r="18" fill="#16211d" stroke="#ffb454" stroke-width="1.3"/><text class="am" x="394" y="146.0" text-anchor="middle" font-size="12">02</text><text class="am" x="430" y="128" font-size="13" letter-spacing=".5">Failure is a feature</text>
<text class="t" x="430" y="150" font-size="11">Retries, duplicate messages, race conditions, partial failures,</text>
<text class="t" x="430" y="167" font-size="11">and corrupted assumptions aren't edge cases. They're the system.</text>
</g>
<g class="fade" style="animation-delay:0.5s"><rect x="360" y="196" width="540" height="84" rx="10" fill="#0c1210" stroke="#1d2b26"/><circle cx="394" cy="238.0" r="18" fill="#16211d" stroke="#ffb454" stroke-width="1.3"/><text class="am" x="394" y="242.0" text-anchor="middle" font-size="12">03</text><text class="am" x="430" y="224" font-size="13" letter-spacing=".5">Measure it</text>
<text class="t" x="430" y="246" font-size="11">If performance matters: benchmark it. If reliability matters:</text>
<text class="t" x="430" y="263" font-size="11">test it. If a model matters: evaluate it.</text>
</g>
<g class="fade" style="animation-delay:0.65s"><rect x="360" y="292" width="540" height="84" rx="10" fill="#0c1210" stroke="#1d2b26"/><circle cx="394" cy="334.0" r="18" fill="#16211d" stroke="#ffb454" stroke-width="1.3"/><text class="am" x="394" y="338.0" text-anchor="middle" font-size="12">04</text><text class="am" x="430" y="320" font-size="13" letter-spacing=".5">Understand the abstraction</text>
<text class="t" x="430" y="342" font-size="11">I like frameworks. I like them much less when I don't</text>
<text class="t" x="430" y="359" font-size="11">understand what they're hiding.</text>
</g>
</svg>