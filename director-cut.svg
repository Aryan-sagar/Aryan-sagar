<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" width="920" height="372" role="img" aria-label="The director's cut: where engineering and filmmaking rhyme" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.t{fill:#d5e6df}.m{fill:#7fa89c}.tl{fill:#5eead4;font-weight:700;letter-spacing:2px}.am{fill:#ffb454;font-weight:700}
.fade{animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fade,.flow,.pulse,.spin{animation:none}}
</style><rect width="920" height="372" rx="12" fill="#070a09"/>
<rect x="20" y="20" width="880" height="40" rx="10" fill="#0c1210" stroke="#1d2b26"/><circle class="pulse" cx="42" cy="40" r="4" fill="#ffb454"/><text class="tl" x="58" y="45" font-size="13">THE DIRECTOR'S CUT</text><text class="m" x="880" y="45" text-anchor="end" font-size="11">where engineering and filmmaking rhyme</text>
<g class="fade" style="animation-delay:0.15s"><rect x="20" y="76" width="430" height="84" rx="10" fill="#0c1210" stroke="#1d2b26"/><rect x="38" y="92" width="108" height="28" rx="6" fill="#16211d" stroke="#24382f"/><text class="tl" x="92.0" y="110" text-anchor="middle" font-size="12" style="letter-spacing:0">Architecture</text><line class="flow" x1="154" x2="186" y1="106" y2="106" stroke="#ffb454" stroke-width="1.6"/><polygon points="186,102 193,106 186,110" fill="#ffb454"/><rect x="194" y="92" width="94" height="28" rx="6" fill="#16211d" stroke="#ffb454"/><text class="am" x="241.0" y="110" text-anchor="middle" font-size="12">Storyboard</text><text class="m" x="38" y="144" font-size="11">decide the shape before the first line or frame</text></g>
<g class="fade" style="animation-delay:0.25s"><rect x="470" y="76" width="430" height="84" rx="10" fill="#0c1210" stroke="#1d2b26"/><rect x="488" y="92" width="72" height="28" rx="6" fill="#16211d" stroke="#24382f"/><text class="tl" x="524.0" y="110" text-anchor="middle" font-size="12" style="letter-spacing:0">Testing</text><line class="flow" x1="568" x2="600" y1="106" y2="106" stroke="#ffb454" stroke-width="1.6"/><polygon points="600,102 607,106 600,110" fill="#ffb454"/><rect x="608" y="92" width="72" height="28" rx="6" fill="#16211d" stroke="#ffb454"/><text class="am" x="644.0" y="110" text-anchor="middle" font-size="12">Retakes</text><text class="m" x="488" y="144" font-size="11">run it until it holds up</text></g>
<g class="fade" style="animation-delay:0.35s"><rect x="20" y="172" width="430" height="84" rx="10" fill="#0c1210" stroke="#1d2b26"/><rect x="38" y="188" width="86" height="28" rx="6" fill="#16211d" stroke="#24382f"/><text class="tl" x="81.0" y="206" text-anchor="middle" font-size="12" style="letter-spacing:0">Debugging</text><line class="flow" x1="132" x2="164" y1="202" y2="202" stroke="#ffb454" stroke-width="1.6"/><polygon points="164,198 171,202 164,206" fill="#ffb454"/><rect x="172" y="188" width="79" height="28" rx="6" fill="#16211d" stroke="#ffb454"/><text class="am" x="211.5" y="206" text-anchor="middle" font-size="12">The edit</text><text class="m" x="38" y="240" font-size="11">the truth shows up when you cut it</text></g>
<g class="fade" style="animation-delay:0.45s"><rect x="470" y="172" width="430" height="84" rx="10" fill="#0c1210" stroke="#1d2b26"/><rect x="488" y="188" width="115" height="28" rx="6" fill="#16211d" stroke="#24382f"/><text class="tl" x="545.5" y="206" text-anchor="middle" font-size="12" style="letter-spacing:0">Observability</text><line class="flow" x1="611" x2="643" y1="202" y2="202" stroke="#ffb454" stroke-width="1.6"/><polygon points="643,198 650,202 643,206" fill="#ffb454"/><rect x="651" y="188" width="94" height="28" rx="6" fill="#16211d" stroke="#ffb454"/><text class="am" x="698.0" y="206" text-anchor="middle" font-size="12">Continuity</text><text class="m" x="488" y="240" font-size="11">notice what drifted between frames</text></g>
<g class="fade" style="animation-delay:0.55s"><rect x="20" y="268" width="430" height="84" rx="10" fill="#0c1210" stroke="#1d2b26"/><rect x="38" y="284" width="72" height="28" rx="6" fill="#16211d" stroke="#24382f"/><text class="tl" x="74.0" y="302" text-anchor="middle" font-size="12" style="letter-spacing:0">Latency</text><line class="flow" x1="118" x2="150" y1="298" y2="298" stroke="#ffb454" stroke-width="1.6"/><polygon points="150,294 157,298 150,302" fill="#ffb454"/><rect x="158" y="284" width="65" height="28" rx="6" fill="#16211d" stroke="#ffb454"/><text class="am" x="190.5" y="302" text-anchor="middle" font-size="12">Pacing</text><text class="m" x="38" y="336" font-size="11">timing decides how it feels</text></g>
<g class="fade" style="animation-delay:0.65s"><rect x="470" y="268" width="430" height="84" rx="10" fill="#0c1210" stroke="#1d2b26"/><rect x="488" y="284" width="137" height="28" rx="6" fill="#16211d" stroke="#24382f"/><text class="tl" x="556.5" y="302" text-anchor="middle" font-size="12" style="letter-spacing:0">Failure recovery</text><line class="flow" x1="633" x2="665" y1="298" y2="298" stroke="#ffb454" stroke-width="1.6"/><polygon points="665,294 672,298 665,302" fill="#ffb454"/><rect x="673" y="284" width="79" height="28" rx="6" fill="#16211d" stroke="#ffb454"/><text class="am" x="712.5" y="302" text-anchor="middle" font-size="12">Reshoots</text><text class="m" x="488" y="336" font-size="11">plan for the day it goes wrong</text></g>
</svg>