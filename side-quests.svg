<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 416" width="920" height="416" role="img" aria-label="Side quests" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
